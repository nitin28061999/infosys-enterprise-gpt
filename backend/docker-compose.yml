version: "3.9"

services:

  api:
    build: .
    container_name: fastapi-api

    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - chroma_data:/app/genAI/vector_db

    depends_on:
      - redis

    restart: unless-stopped

  worker:
    build: .

    container_name: arq-worker

    command: >
      arq config.arq_config.WorkerSettings

    env_file:
      - .env

    volumes:
      - chroma_data:/app/genAI/vector_db

    depends_on:
      - redis

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: redis

    ports:
      - "6379:6379"

    restart: unless-stopped

volumes:
  chroma_data: